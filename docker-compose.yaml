services:
  db:
    container_name: cinematheque-db
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    container_name: cinematheque-backend
    image: ghcr.io/bolinocroustibat/cinematheque-backend:${TAG:-latest}
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - static_volume:/app/static
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Application settings
      - ENVIRONMENT=${ENVIRONMENT:-unknown}
      - DEBUG=${DEBUG:-false}

      # Django settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}

      # Database settings
      - POSTGRES_DB=${POSTGRES_DB}

      # CORS settings
      - CORS_ORIGIN_ALLOW_ALL=${CORS_ORIGIN_ALLOW_ALL:-True}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-4173}}

      # Movie recommendations LLM (Gemini today; same env if you swap provider)
      - LLM_API_KEY=${LLM_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/\")'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend-cinematheque:
    container_name: cinematheque-frontend
    image: ghcr.io/bolinocroustibat/cinematheque-frontend:${TAG:-latest}
    build:
      context: ./frontend-cinematheque
      dockerfile: Dockerfile
      args:
        - VITE_TMDB_KEY=${VITE_TMDB_KEY}
        - VITE_OMDB_KEY=${VITE_OMDB_KEY}
        - VITE_SHEETS_API=${VITE_SHEETS_API}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - VITE_ENV=${VITE_ENV:-local}
    depends_on:
      backend:
        condition: service_healthy

  frontend-palettes:
    container_name: cinematheque-frontend-palettes
    image: ghcr.io/bolinocroustibat/cinematheque-frontend-palettes:${TAG:-latest}
    build:
      context: ./frontend-palettes
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${MOVIES_PALETTES_PORT:-3001}:3000"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
